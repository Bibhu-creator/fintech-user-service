spring:
  application:
    name: user-service

  # Database
  datasource:
    url: jdbc:mysql://localhost:3307/fintech_user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: fintech_app
    password: fintech_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  # Liquibase
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# Server
server:
  port: 8081

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.fintech: DEBUG
    org.springframework.security: WARN

# Eureka - disabled until discovery server is set up
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# JWT
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 1800000

# Storage
storage:
  local:
    base-path: C:/fintech-uploads

